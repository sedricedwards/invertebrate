schema_version: "1.1"
name: invertebrate-config-wins
expected_outcome: |
  With both .invertebrate/ and .greptile/ in the repo root, the review applies .invertebrate/ (strictness 3, audit-order-changes rule) and ignores .greptile/ (strictness 1, docstrings-required rule). It flags the missing ownership check in cancel_order as P0 and the missing audit_log citing audit-order-changes, does not flag the missing docstring, and names .invertebrate as the config used.
context:
  scaffold_script: place-files.sh
