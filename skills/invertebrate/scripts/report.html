<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invertebrate Review</title>
<style>
:root {
  --bg: #f6f4ef; --panel: #fffdf8; --ink: #1d1b18; --muted: #6b665d; --rule: #d9d4c9; --code: #efece4;
  --crit: #b3261e; --high: #b85600; --med: #8a6d00; --ok: #2e7d32;
  --crit-bg: #fbe9e7; --high-bg: #fdf0e1; --med-bg: #faf5d9; --ok-bg: #e8f3e8;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --mono: "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171614; --panel: #1f1d1a; --ink: #ece8df; --muted: #a39d91; --rule: #3a3631; --code: #2a2723;
    --crit: #ff8a80; --high: #ffb74d; --med: #e6cc4d; --ok: #81c784;
    --crit-bg: #3b1e1b; --high-bg: #3a2a16; --med-bg: #35301a; --ok-bg: #1e3220;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 var(--serif); }
main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 16px; }
h2 { font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--rule); padding-bottom: 6px; margin: 40px 0 16px; }
h3 { font-size: 1.15rem; margin: 8px 0 2px; }
code, pre, .loc, .bar-n, .num { font-family: var(--mono); }
code { background: var(--code); padding: 0 4px; font-size: 0.88em; }
pre { background: var(--code); padding: 12px; overflow-x: auto; font-size: 0.82rem; line-height: 1.45; margin: 12px 0; }
.verdict { background: var(--cb); border-left: 6px solid var(--c); padding: 20px 24px; }
.eyebrow { margin: 0 0 4px; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.merge { font-size: 1.35rem; margin: 0; }
.merge strong { color: var(--c); }
.verdict-text { margin: 4px 0 16px; }
.score { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.num { font-size: 1.4rem; font-weight: 700; color: var(--c); }
.meter { display: flex; gap: 3px; }
.meter span { width: 26px; height: 10px; background: var(--rule); }
.meter span.on { background: var(--c); }
.why { color: var(--muted); flex-basis: 100%; }
.bars { display: grid; gap: 8px; max-width: 520px; }
.bar-row { display: grid; grid-template-columns: 6.5em 1fr 2em; align-items: center; gap: 10px; }
.bar-track { height: 16px; background: var(--code); }
.bar-fill { display: block; height: 100%; background: var(--c); }
.bar-n { text-align: right; }
.trend-fig { margin: 24px 0 0; }
.trend-fig figcaption { color: var(--muted); font-size: 0.9rem; }
.trend { width: 100%; max-width: 320px; height: auto; overflow: visible; }
.trend polyline { fill: none; stroke: var(--muted); stroke-width: 2; }
.trend text { fill: var(--ink); font: 12px var(--mono); text-anchor: middle; }
.status { list-style: none; padding: 0; margin: 0; }
.status li { display: flex; gap: 12px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--rule); }
.chip { background: var(--cb); color: var(--c); border: 1px solid var(--c); padding: 1px 8px; font-size: 0.82rem; font-weight: 700; white-space: nowrap; }
.tag { color: var(--muted); font-size: 0.85rem; }
.tags { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; margin: 0; }
.finding { background: var(--panel); border: 1px solid var(--rule); border-left: 6px solid var(--c); padding: 16px 20px; margin: 0 0 16px; }
.loc { color: var(--muted); font-size: 0.85rem; margin: 0 0 8px; overflow-wrap: anywhere; }
.diff span { display: block; }
.diff .add { background: var(--ok-bg); }
.diff .del { background: var(--crit-bg); }
summary { cursor: pointer; color: var(--muted); }
.none { color: var(--ok); font-weight: 700; }
.muted, footer { color: var(--muted); font-size: 0.85rem; }
footer { margin-top: 40px; border-top: 1px solid var(--rule); padding-top: 12px; }
.diagram-wrap { background: var(--panel); border: 1px solid var(--rule); padding: 12px; }
.diagram { display: block; width: 100%; height: auto; margin: 0 auto; }
.diagram text { font-size: 13px; fill: var(--ink); text-anchor: middle; dominant-baseline: middle; }
.diagram .title { font-weight: 700; }
.diagram text.start { text-anchor: start; }
.diagram .box { fill: var(--panel); stroke: var(--muted); stroke-width: 1.2; }
.diagram .divider { stroke: var(--rule); }
.diagram .life { stroke: var(--rule); stroke-dasharray: 4 4; }
.diagram .edge { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.diagram .arrow { fill: var(--muted); }
.diagram .arrow-bad { fill: var(--crit); }
.diagram .halo { paint-order: stroke; stroke: var(--panel); stroke-width: 5px; stroke-linejoin: round; }
.diagram .note rect { fill: var(--med-bg); stroke: var(--med); }
.diagram .edge.bad, .diagram .bad .box, .diagram .note.bad rect { stroke: var(--crit); stroke-width: 2; }
.diagram .note.bad rect, .diagram .node.bad .box { fill: var(--crit-bg); }
.diagram text.bad, .diagram .bad text { fill: var(--crit); }
</style>
</head>
<body>
<main></main>
<script type="application/json" id="review-data">__REVIEW_DATA__</script>
<script>
const D = JSON.parse(document.getElementById('review-data').textContent);
const SEV = { P0: ['Critical', 'crit'], P1: ['High', 'high'], P2: ['Medium', 'med'] };
const TYPE = { logic: 'Bug', syntax: "Won't compile", style: 'Cleanup' };
const PROOF = { repro: 'Proven by test', build: 'Proven by build', trace: 'Found by search', none: 'Unproven' };
const STATUS = { resolved: ['Fixed', 'ok'], open: ['Still open', 'high'], regressed: ['Broke again', 'crit'] };
const MERGE = ['No', 'No', 'No', 'Not yet', 'After small fixes', 'Yes'];
const tone = s => s >= 4 ? 'ok' : s === 3 ? 'med' : s === 2 ? 'high' : 'crit';
const main = document.querySelector('main');

// All review text goes in through textContent: PR content is untrusted.
function inline(node, text) {
  text.split('`').forEach((part, i) => node.append(i % 2 ? Object.assign(document.createElement('code'), { textContent: part }) : part));
}
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) inline(node, String(text));
  return node;
}
function setTone(node, t) {
  node.style.setProperty('--c', `var(--${t})`);
  node.style.setProperty('--cb', `var(--${t}-bg)`);
}
function section(title) {
  const s = el('section');
  s.append(el('h2', null, title));
  main.append(s);
  return s;
}

function header(score) {
  const head = el('header', 'verdict');
  setTone(head, tone(score));
  const merge = el('p', 'merge', 'Safe to merge? ');
  merge.append(el('strong', null, MERGE[score] ?? 'No'));
  const meter = el('div', 'meter');
  meter.setAttribute('role', 'img');
  meter.setAttribute('aria-label', `Confidence ${score} out of 5`);
  for (let i = 1; i <= 5; i++) meter.append(el('span', i <= score ? 'on' : ''));
  const sc = el('div', 'score');
  sc.append(el('span', 'num', `${score}/5`), meter, el('span', 'why', D.score_reason));
  head.append(el('p', 'eyebrow', 'Invertebrate code review'), el('h1', null, D.title), merge, el('p', 'verdict-text', D.verdict), sc);
  return head;
}

function severityBars(findings) {
  const counts = Object.keys(SEV).map(k => [k, findings.filter(f => f.sev === k).length]);
  const max = Math.max(1, ...counts.map(c => c[1]));
  const bars = el('div', 'bars');
  for (const [k, n] of counts) {
    const row = el('div', 'bar-row');
    setTone(row, SEV[k][1]);
    const track = el('span', 'bar-track');
    const fill = el('span', 'bar-fill');
    fill.style.width = `${n / max * 100}%`;
    track.append(fill);
    row.append(el('span', null, SEV[k][0]), track, el('span', 'bar-n', n));
    bars.append(row);
  }
  return bars;
}

function trend(scores) {
  const NS = 'http://www.w3.org/2000/svg', w = 300, h = 90, pad = 16;
  const x = i => pad + i * (w - 2 * pad) / (scores.length - 1);
  const y = s => h - pad - s * (h - 2 * pad) / 5;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.setAttribute('class', 'trend');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Score across reviews: ' + scores.join(' then '));
  const line = document.createElementNS(NS, 'polyline');
  line.setAttribute('points', scores.map((s, i) => `${x(i)},${y(s)}`).join(' '));
  svg.append(line);
  scores.forEach((s, i) => {
    const dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(s)); dot.setAttribute('r', 5);
    dot.style.fill = `var(--${tone(s)})`;
    const label = document.createElementNS(NS, 'text');
    label.setAttribute('x', x(i)); label.setAttribute('y', y(s) - 10);
    label.textContent = `${s}/5`;
    svg.append(dot, label);
  });
  const fig = el('figure', 'trend-fig');
  fig.append(el('figcaption', null, 'Score across reviews'), svg);
  return fig;
}

function diffBlock(text) {
  const pre = el('pre', 'diff');
  for (const line of text.split('\n')) {
    const span = el('span', line[0] === '+' ? 'add' : line[0] === '-' ? 'del' : '');
    span.textContent = line;
    pre.append(span);
  }
  return pre;
}

function card(f) {
  const [label, t] = SEV[f.sev] || [f.sev, 'med'];
  const article = el('article', 'finding');
  setTone(article, t);
  const tags = el('p', 'tags');
  tags.append(el('span', 'chip', `${label} · ${f.sev}`), el('span', 'tag', TYPE[f.type] || f.type), el('span', 'tag', PROOF[f.proof] || f.proof));
  article.append(tags, el('h3', null, `${f.n}. ${f.title}`), el('p', 'loc', f.location), el('p', null, f.body));
  if (f.diff) article.append(diffBlock(f.diff));
  if (f.repro) {
    const details = el('details');
    const pre = el('pre');
    pre.textContent = f.repro;
    details.append(el('summary', null, f.proof === 'build' ? 'Build error that proves it' : 'Test that proves it'), pre);
    article.append(details);
  }
  return article;
}

// ---- Diagrams: in-house renderer for {kind: 'sequence'} and {kind: 'graph'} specs ----
// Pure functions, no DOM: tests/test_report.py runs the code between the layout markers under node.
// layout:start

// Longest-path layering. DFS marks edges that close a cycle as back edges; they don't push layers down.
function graphLayers(ids, edges) {
  const out = new Map(ids.map(id => [id, []]));
  edges.forEach((e, i) => out.get(e.from).push([e.to, i]));
  const state = new Map(), back = new Set(), finished = [];
  const visit = id => {
    state.set(id, 'open');
    for (const [to, i] of out.get(id)) {
      if (state.get(to) === 'open') back.add(i);
      if (!state.has(to)) visit(to);
    }
    state.set(id, 'done');
    finished.push(id);
  };
  ids.forEach(id => state.has(id) || visit(id));
  const layer = new Map(ids.map(id => [id, 0]));
  for (const id of finished.reverse()) {
    for (const [to, i] of out.get(id)) {
      if (!back.has(i)) layer.set(to, Math.max(layer.get(to), layer.get(id) + 1));
    }
  }
  return { layer, back };
}

// Every edge becomes a chain of one-row steps: an edge that spans rows (long, or a back edge drawn upward)
// gets an invisible waypoint in each row it crosses, so row ordering reserves it a lane clear of the boxes.
// Adds waypoint layers to `layer`. Chains run from e.from to e.to.
function graphChains(edges, layer, back) {
  const segments = [], waypoints = [];
  const chains = edges.map((e, i) => {
    const [top, bottom] = back.has(i) ? [e.to, e.from] : [e.from, e.to];
    const chain = [top];
    for (let l = layer.get(top) + 1; l < layer.get(bottom); l++) {
      const id = `~${i}.${l}`;
      layer.set(id, l);
      waypoints.push(id);
      chain.push(id);
    }
    chain.push(bottom);
    if (top !== bottom) chain.slice(1).forEach((id, k) => segments.push({ from: chain[k], to: id }));
    return back.has(i) ? chain.reverse() : chain;
  });
  return { chains, waypoints, segments };
}

// Rows of ids; each row after the first is sorted by the mean position of its parents to cut crossings.
// `segments` must all go down exactly one row (graphChains output).
// ponytail: one downward barycenter sweep; add up/down sweeps if diagrams grow past ~15 boxes.
function graphRows(ids, segments, layer) {
  const rows = [];
  ids.forEach(id => (rows[layer.get(id)] ||= []).push(id));
  const pos = new Map();
  rows[0].forEach((id, i) => pos.set(id, i));
  for (const row of rows.slice(1)) {
    const parents = id => segments.filter(e => e.to === id).map(e => pos.get(e.from));
    const bary = new Map(row.map((id, i) => [id, parents(id).reduce((a, b) => a + b, 0) / parents(id).length]));
    row.sort((a, b) => bary.get(a) - bary.get(b));
    row.forEach((id, i) => pos.set(id, i));
  }
  return rows;
}
// layout:end

const SVGNS = 'http://www.w3.org/2000/svg';
const measure = document.createElement('canvas').getContext('2d');
function textWidth(text) {
  measure.font = `13px ${getComputedStyle(document.body).fontFamily}`;
  return measure.measureText(String(text)).width;
}
function svgEl(tag, attrs, text) {
  const node = document.createElementNS(SVGNS, tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  if (text != null) node.textContent = text;
  return node;
}
function svgRoot(w, h, label) {
  const svg = svgEl('svg', { viewBox: `0 0 ${w} ${h}`, class: 'diagram', role: 'img', 'aria-label': label });
  svg.style.maxWidth = `${w}px`;
  const defs = svgEl('defs', {});
  for (const id of ['arrow', 'arrow-bad']) {
    const marker = svgEl('marker', { id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 8, markerHeight: 8, orient: 'auto-start-reverse' });
    marker.append(svgEl('path', { d: 'M0,0 L10,5 L0,10 z', class: id }));
    defs.append(marker);
  }
  svg.append(defs);
  return svg;
}
const arrowOf = item => `url(#${item.bad ? 'arrow-bad' : 'arrow'})`;
const badClass = (cls, item) => item.bad ? `${cls} bad` : cls;

function renderSequence(spec) {
  const steps = spec.steps || [];
  const named = steps.flatMap(s => s.note != null ? [s.over] : [s.from, s.to]);
  const actors = [...new Set([...(spec.actors || []), ...named])].filter(a => a != null);
  const col = Math.max(140, ...actors.map(a => textWidth(a) + 40), ...steps.map(s => textWidth(s.label ?? s.note ?? '') + 40));
  const PAD = 16, BOX_H = 36, ROW = 46, TOP = PAD + BOX_H + 30;
  const x = name => PAD + col / 2 + actors.indexOf(name) * col;
  const w = 2 * PAD + col * actors.length, h = TOP + steps.length * ROW;
  const svg = svgRoot(w, h, 'Sequence diagram');
  for (const a of actors) {
    svg.append(svgEl('line', { x1: x(a), y1: PAD + BOX_H, x2: x(a), y2: h - PAD / 2, class: 'life' }));
    svg.append(svgEl('rect', { x: x(a) - col / 2 + 10, y: PAD, width: col - 20, height: BOX_H, class: 'box' }));
    svg.append(svgEl('text', { x: x(a), y: PAD + BOX_H / 2 }, a));
  }
  steps.forEach((s, i) => svg.append(...(s.note != null ? noteShapes(s, x(s.over), TOP + i * ROW) : messageShapes(s, x(s.from), x(s.to), TOP + i * ROW))));
  return svg;
}
function messageShapes(s, x1, x2, y) {
  // A message to oneself is a loop out to the right and back.
  const d = x1 === x2 ? `M${x1},${y - 8} h36 v16 h-34` : `M${x1},${y} L${x2 + Math.sign(x1 - x2) * 2},${y}`;
  const label = x1 === x2
    ? svgEl('text', { x: x1 + 44, y, class: badClass('halo start', s) }, s.label ?? '')
    : svgEl('text', { x: (x1 + x2) / 2, y: y - 12, class: badClass('halo', s) }, s.label ?? '');
  return [svgEl('path', { d, class: badClass('edge', s), 'marker-end': arrowOf(s) }), label];
}
function noteShapes(s, cx, y) {
  const w = textWidth(s.note) + 24;
  const g = svgEl('g', { class: badClass('note', s) });
  g.append(svgEl('rect', { x: cx - w / 2, y: y - 14, width: w, height: 28 }), svgEl('text', { x: cx, y }, s.note));
  return [g];
}

function renderGraph(spec) {
  const nodes = spec.nodes || [];
  const box = new Map(nodes.map(n => {
    const lines = [n.label ?? n.id, ...(n.fields || [])];
    return [n.id, { n, lines, w: Math.max(...lines.map(textWidth)) + 32, h: 16 + lines.length * 20 + (lines.length > 1 ? 6 : 0) }];
  }));
  const edges = (spec.edges || []).filter(e => box.has(e.from) && box.has(e.to));
  const ids = [...box.keys()];
  const { layer, back } = graphLayers(ids, edges);
  const { chains, waypoints, segments } = graphChains(edges, layer, back);
  // A waypoint is a zero-height slot; the one mid-chain is as wide as the edge's label so the label gets room.
  waypoints.forEach(id => box.set(id, { w: 12, h: 0 }));
  chains.forEach((chain, i) => {
    const mid = chain[Math.floor(chain.length / 2)];
    if (waypoints.includes(mid) && edges[i].label) box.get(mid).w = textWidth(edges[i].label) + 16;
  });
  const rows = graphRows([...ids, ...waypoints], segments, layer);
  const GAP_X = 48, GAP_Y = 80, PAD = 24;
  const rowW = rows.map(r => r.reduce((sum, id) => sum + box.get(id).w, 0) + GAP_X * (r.length - 1));
  const w = Math.max(...rowW) + 2 * PAD;
  let y = PAD;
  rows.forEach((row, ri) => {
    const rowH = Math.max(...row.map(id => box.get(id).h));
    let x = (w - rowW[ri]) / 2;
    for (const id of row) {
      Object.assign(box.get(id), { cx: x + box.get(id).w / 2, cy: y + rowH / 2 });
      x += box.get(id).w + GAP_X;
    }
    y += rowH + GAP_Y;
  });
  const svg = svgRoot(w, y - GAP_Y + PAD, 'Diagram');
  const shapes = edges.map((e, i) => edgeShapes(chains[i].map(id => box.get(id)), e));
  svg.append(...shapes.map(s => s[0]), ...ids.map(id => nodeShape(box.get(id))), ...shapes.map(s => s[1]));
  return svg;
}
// Point where the ray from the box center toward (px, py) leaves the box.
function clip(b, px, py) {
  const dx = px - b.cx, dy = py - b.cy;
  const t = Math.min(b.w / 2 / Math.abs(dx), b.h / 2 / Math.abs(dy));
  return [b.cx + dx * t, b.cy + dy * t];
}
function edgeShapes(points, e) {
  const [a, b] = [points[0], points[points.length - 1]];
  const line = d => svgEl('path', { d, class: badClass('edge', e), 'marker-end': arrowOf(e) });
  if (a === b) {
    // Self-loop off the right side.
    const x = a.cx + a.w / 2, y = a.cy;
    return [line(`M${x},${y - 8} C${x + 30},${y - 30} ${x + 30},${y + 30} ${x},${y + 8}`), svgEl('text', { x: x + 34, y, class: badClass('halo start', e) }, e.label ?? '')];
  }
  // Label sits on the middle point; a waypoint chain reserved room for it there.
  let anchor = points[Math.floor(points.length / 2)];
  if (points.length === 2) {
    // A one-row edge bows slightly to its left, so A->B and B->A don't draw on top of each other,
    // and its label goes fully on that side of the curve.
    const len = Math.hypot(b.cx - a.cx, b.cy - a.cy);
    const ux = (b.cy - a.cy) / len, uy = -(b.cx - a.cx) / len, mx = (a.cx + b.cx) / 2, my = (a.cy + b.cy) / 2;
    const off = 12 + Math.abs(ux) * textWidth(e.label ?? '') / 2 + Math.abs(uy) * 8;
    points = [a, { cx: mx + ux * 14, cy: my + uy * 14 }, b];
    anchor = { cx: mx + ux * off, cy: my + uy * off };
  }
  // Smooth path: interior points are quadratic control points, joined at the midpoints between them.
  const start = clip(a, points[1].cx, points[1].cy), end = clip(b, points[points.length - 2].cx, points[points.length - 2].cy);
  let d = `M${start}`;
  for (let i = 1; i < points.length - 1; i++) {
    const next = i === points.length - 2 ? end : [(points[i].cx + points[i + 1].cx) / 2, (points[i].cy + points[i + 1].cy) / 2];
    d += ` Q${points[i].cx},${points[i].cy} ${next}`;
  }
  return [line(d), svgEl('text', { x: anchor.cx, y: anchor.cy, class: badClass('halo', e) }, e.label ?? '')];
}
function nodeShape(b) {
  const g = svgEl('g', { class: badClass('node', b.n) });
  const top = b.cy - b.h / 2, left = b.cx - b.w / 2;
  g.append(svgEl('rect', { x: left, y: top, width: b.w, height: b.h, class: 'box' }));
  g.append(svgEl('text', { x: b.cx, y: top + 18, class: 'title' }, b.lines[0]));
  if (b.lines.length > 1) g.append(svgEl('line', { x1: left, y1: top + 32, x2: left + b.w, y2: top + 32, class: 'divider' }));
  b.lines.slice(1).forEach((f, i) => g.append(svgEl('text', { x: left + 14, y: top + 50 + i * 20, class: 'start' }, f)));
  return g;
}

function diagram(spec) {
  const render = { sequence: renderSequence, graph: renderGraph }[spec.kind];
  if (!render || !(spec.nodes || spec.steps || []).length) return;
  const wrap = el('div', 'diagram-wrap');
  wrap.append(render(spec));
  section('How the change works').append(wrap);
}

const score = Math.max(0, Math.min(5, Number(D.score) || 0));
const findings = D.findings || [];
document.title = `Review: ${D.title || 'Invertebrate'}`;
main.append(header(score));
section('What this change does').append(el('p', null, D.summary));
const glance = section('At a glance');
glance.append(severityBars(findings));
if ((D.scores || []).length > 1) glance.append(trend(D.scores));
if ((D.since_last || []).length) {
  const list = el('ul', 'status');
  for (const r of D.since_last) {
    const [label, t] = STATUS[r.status] || [r.status, 'med'];
    const chip = el('span', 'chip', label);
    setTone(chip, t);
    const li = el('li');
    li.append(chip, el('span', null, r.title));
    list.append(li);
  }
  section('Since the last review').append(list);
}
if (D.diagram) diagram(D.diagram);
const issues = section('Issues found');
if (!findings.length) issues.append(el('p', 'none', 'No issues found.'));
findings.forEach(f => issues.append(card(f)));
if (D.footer) main.append(el('footer', null, D.footer));
</script>
</body>
</html>
